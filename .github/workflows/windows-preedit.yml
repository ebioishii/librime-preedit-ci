name: librime 1.13.1 Windows MSVC x64 test

on:
  workflow_dispatch:
    inputs:
      diagnose_installer:
        description: 'Evidence only: list and compare NSIS extraction; do not build or package'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  diagnose-installer:
    if: ${{ inputs.diagnose_installer }}
    runs-on: windows-2022
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve exact patch bytes
        run: git config --global core.autocrlf false
      - name: Checkout diagnostic source only
        uses: actions/checkout@v4
      - name: Download official installer without executing it
        run: |
          New-Item -ItemType Directory -Path weasel-official | Out-Null
          Invoke-WebRequest -Uri 'https://github.com/rime/weasel/releases/download/0.17.4/weasel-0.17.4.0-installer.exe' -OutFile 'weasel-official\weasel-0.17.4.0-installer.exe'
      - name: Verify hashes and collect NSIS extraction evidence only
        run: |
          python ci\package_sandbox.py --diagnose-installer 2>&1 | Tee-Object -FilePath windows-installer-diagnosis.log
          exit $LASTEXITCODE
      - name: Preserve text diagnostics only, even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weasel-0.17.4-installer-diagnostics
          path: |
            installer-diagnostics/*.txt
            installer-diagnostics/*.json
            installer-diagnostics/*.log
            windows-installer-diagnosis.log
          if-no-files-found: error
          retention-days: 14

  build:
    if: ${{ !inputs.diagnose_installer }}
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      boost_version: 1.84.0
      BOOST_ROOT: ${{ github.workspace }}\librime\deps\boost-1.84.0
      RIME_PLUGINS: lua
      GLOG_log_dir: ${{ github.workspace }}
      GLOG_alsologtostderr: '1'
    defaults:
      run:
        shell: pwsh
        working-directory: librime
    steps:
      - name: Preserve exact patch bytes
        working-directory: ${{ github.workspace }}
        run: git config --global core.autocrlf false

      - name: Checkout test repository
        uses: actions/checkout@v4

      - name: Checkout librime 1.13.1 and dependencies
        uses: actions/checkout@v4
        with:
          repository: rime/librime
          ref: 1c23358157934bd6e6d6981f0c0164f05393b497
          submodules: recursive
          path: librime

      - name: Checkout pinned librime-lua from the librime 1.13.1 release era
        uses: actions/checkout@v4
        with:
          repository: hchunhui/librime-lua
          ref: e3912a4b3ac2c202d89face3fef3d41eb1d7fcd6
          path: librime/plugins/lua

      - name: Checkout official in-tree Lua 5.4.7 sources
        uses: actions/checkout@v4
        with:
          repository: hchunhui/librime-lua
          ref: 115e000c878d1170337f7ca934d7a84f68986e39
          path: librime/plugins/lua/thirdparty

      - name: Install only synthetic Lua integration test fixtures
        run: |
          Copy-Item -LiteralPath "$env:GITHUB_WORKSPACE\ci\lua_preedit_test.cc" -Destination test\lua_preedit_test.cc
          New-Item -ItemType Directory -Force -Path build\test\lua | Out-Null
          Copy-Item -LiteralPath "$env:GITHUB_WORKSPACE\ci\ci_preedit_smoke.lua" -Destination build\test\lua\ci_preedit_smoke.lua
          git -C plugins\lua rev-parse HEAD
          git -C plugins\lua\thirdparty rev-parse HEAD
          Select-String -LiteralPath plugins\lua\thirdparty\lua5.4\lua.h -Pattern 'LUA_VERSION_RELEASE\s'

      - name: Verify and apply second patch with test-only MSVC fix
        run: |
          $patch = Join-Path $env:GITHUB_WORKSPACE 'librime-1.13.1-preedit-fallback.patch'
          $expected = 'D73347ABE76DC87FEF859B5A63DEDEB571A796009265DDF4D4C404BB3AC888CA'
          if ((Get-FileHash -LiteralPath $patch -Algorithm SHA256).Hash -ne $expected) {
            throw 'Patch SHA-256 mismatch'
          }
          git apply --check $patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git apply $patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure MSVC x64 using official workflow action
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake and Ninja on isolated runner
        run: |
          python -m pip install cmake==3.31.6 ninja
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $scripts = python -c "import sysconfig; print(sysconfig.get_path('scripts'))"
          $scripts | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $scripts 'cmake.exe') --version
          & (Join-Path $scripts 'ninja.exe') --version

      - name: Create official build environment
        run: |
          @'
          set RIME_ROOT=%CD%
          set CXX=cl
          set CC=cl
          set CMAKE_GENERATOR=Ninja
          '@ | Set-Content -LiteralPath env.bat -Encoding ascii
          if ($env:VSCMD_ARG_TGT_ARCH -ne 'x64') { throw 'MSVC target is not x64' }
          Get-Content env.bat
          cmake --version

      - name: Install Boost using official script
        run: |
          & .\install-boost.bat 2>&1 | Tee-Object -FilePath "$env:GITHUB_WORKSPACE\windows-boost.log"
          exit $LASTEXITCODE

      - name: Build dependencies using official script
        run: |
          & .\build.bat deps 2>&1 | Tee-Object -FilePath "$env:GITHUB_WORKSPACE\windows-deps.log"
          exit $LASTEXITCODE

      - name: Build librime and run four preedit tests using official script
        run: |
          & .\build.bat test 2>&1 | Tee-Object -FilePath "$env:GITHUB_WORKSPACE\windows-build-preedit.log"
          $result = $LASTEXITCODE
          $ctestLog = 'build\test\Testing\Temporary\LastTest.log'
          if (Test-Path -LiteralPath $ctestLog) {
            Copy-Item -LiteralPath $ctestLog -Destination "$env:GITHUB_WORKSPACE\windows-preedit-ctest.log"
          }
          exit $result
        env:
          GTEST_FILTER: PreeditInputTest.*
          GTEST_OUTPUT: xml:${{ github.workspace }}\windows-preedit-results.xml

      - name: Run Lua module and translator integration tests
        run: |
          ctest --test-dir build\test -C Release --output-on-failure 2>&1 | Tee-Object -FilePath "$env:GITHUB_WORKSPACE\windows-lua.log"
          $result = $LASTEXITCODE
          $ctestLog = 'build\test\Testing\Temporary\LastTest.log'
          if (Test-Path -LiteralPath $ctestLog) {
            Copy-Item -LiteralPath $ctestLog -Destination "$env:GITHUB_WORKSPACE\windows-lua-ctest.log"
          }
          exit $result
        env:
          GTEST_FILTER: LuaPreeditInputTest.*
          GTEST_OUTPUT: xml:${{ github.workspace }}\windows-lua-results.xml

      - name: Run existing core tests without repeating integration tests
        run: |
          ctest --test-dir build\test -C Release --output-on-failure 2>&1 | Tee-Object -FilePath "$env:GITHUB_WORKSPACE\windows-core.log"
          $result = $LASTEXITCODE
          $ctestLog = 'build\test\Testing\Temporary\LastTest.log'
          if (Test-Path -LiteralPath $ctestLog) {
            Copy-Item -LiteralPath $ctestLog -Destination "$env:GITHUB_WORKSPACE\windows-core-ctest.log"
          }
          exit $result
        env:
          GTEST_FILTER: '-PreeditInputTest.*:LuaPreeditInputTest.*'
          GTEST_OUTPUT: xml:${{ github.workspace }}\windows-core-results.xml

      - name: Print actual test counts
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          foreach ($file in 'windows-preedit-results.xml', 'windows-lua-results.xml', 'windows-core-results.xml') {
            if (Test-Path -LiteralPath $file) {
              [xml]$report = Get-Content -LiteralPath $file -Raw
              Write-Output "$file : $($report.testsuites.OuterXml)"
            } else {
              Write-Output "$file : NOT RUN - no test XML produced"
            }
          }

      - name: Check Lua runtime diagnostics
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          $logs = Get-ChildItem -LiteralPath . -Filter 'rime.test*.log' -File
          $errors = $logs | Select-String -Pattern 'LuaTranslation::Next error|LuaTranslator::.*error|Lua Compoment.*error|rime\.lua error'
          if ($errors) {
            $errors | ForEach-Object { $_.ToString() } | Tee-Object -FilePath windows-lua-errors.log
            throw 'Lua runtime errors were recorded; see windows-lua-errors.log'
          }
          Write-Output 'No Lua runtime errors found in captured Rime logs.'

      - name: Save build logs and test results without binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-msvc-x64-results
          path: |
            windows-*.log
            windows-*-results.xml
            rime.test*.log
            librime/build/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: warn
          retention-days: 14

      - name: Download and inspect official Weasel installer without executing it
        working-directory: ${{ github.workspace }}
        run: |
          New-Item -ItemType Directory -Path weasel-official | Out-Null
          $installer = 'weasel-official\weasel-0.17.4.0-installer.exe'
          Invoke-WebRequest -Uri 'https://github.com/rime/weasel/releases/download/0.17.4/weasel-0.17.4.0-installer.exe' -OutFile $installer
          if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash -ne 'CF509534A8F5F8AF9C98ED7CBB8F135439F145A8CBE7E50EDE42BB5B5AB45C29') {
            throw 'Official Weasel installer SHA-256 mismatch; refusing to extract or package'
          }
          7z x $installer -oweasel-official\extracted -y 2>&1 | Tee-Object -FilePath windows-weasel-extract.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check official x64 compatibility and create gated Sandbox package
        working-directory: ${{ github.workspace }}
        run: |
          python ci\package_sandbox.py 2>&1 | Tee-Object -FilePath windows-sandbox-package.log
          exit $LASTEXITCODE

      - name: Upload Sandbox package only after all tests and compatibility checks pass
        uses: actions/upload-artifact@v4
        with:
          name: weasel-0.17.4-preedit-x64-sandbox
          path: sandbox-output/*
          if-no-files-found: error
          retention-days: 14

      - name: Preserve compatibility diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-sandbox-compatibility-logs
          path: |
            windows-weasel-extract.log
            windows-sandbox-package.log
          if-no-files-found: warn
          retention-days: 14
